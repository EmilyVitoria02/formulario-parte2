<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários - Parte 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <div>  
    
  <header>
    <h1>Login</h1>
  </header>

  <main>

        <form action="" method="">
            <fieldset  class="fieldset">
            <legend>Dados pessoais</legend>

            <label for="fullname">Nome completo: </label>
            <input 
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Digite seu nome completo"
            value=""
            required
            >

            <br> <br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu melhor e-mail" required>

            <br><br>

            <label for="senha">Senha:</label>
            <input type="password" id="password" name="password" placeholder="Informe sua senha" required>

            <br> <br>

            <label for="telefone">Telefone: </label>
            <input type="tel" id="number" name="number" placeholder="Ex:(99) 9999-9999" required>

            <br> <br>

            <label for="date">Data de nascimento: </label>
            <input type="date"  id="date" name="date" required>
            


        </fieldset> <br>

        <fieldset id="fieldset-selection">
          <legend>Inputs de Seleção</legend>

          <label for="haircut">Corte</label>
          <input type="checkbox" name="services" id="haircut" value="haircut">

          <label for="coloring">Pintura</label>
          <input type="checkbox" id="coloring" name="services" value="coloring">

          <label for="blowdry">Escova</label>
          <input type="checkbox" id="blowdry" name="services" value="blowdry" checked>

          <br><br>

          <label for="male">Masculino</label>
          <input type="radio" id="male" name="gender" value="male">

          <label for="female">Feminino</label>
          <input type="radio" id="female" name="gender" value="female">

          <label for="other">Outro</label>
          <input type="radio" id="other" name="gender" value="other">

          <br><br>

          <label for="state">Estado</label>
          <select name="state" id="state" class="select-field">
            <option value="">Selecione...</option>
            <option value="MA">Maranhão</option>
            <option value="PI">Piauí</option>
            <option value="PA">Pará</option>
          </select>

        </fieldset>
        <br>

        <fieldset id="fieldset-arquivo">
          <legend>Arquivos</legend>
          <label for="profile-photo">Foto de Perfil</label><br>
          <input type="file" id="profile-photo" name="profile-photo" class="file-field" accept="image/*">
        </fieldset>

        <br>
        <fieldset class="fieldset">
          <legend>Mensagem</legend>

          <label for="message">Faca um comentário sobre sua experiência: </label><br>
          <textarea name="message" id="message" class="text-field" rows="2" cols="37"></textarea>
        </fieldset>

        <button type="submit" id="btn">ENVIAR</button>
    </form>
  </main>
</div>

  <footer>
    <p>Desenvolvido por Emily Vitória</p>
  </footer>
</body>
</html>
